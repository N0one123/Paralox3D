[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "paralox3d"
version = "0.1.0"
description = "A performance-first Python 3D engine with a native C++ core."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "N0one123"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/N0one123/Paralox3D"
Repository = "https://github.com/N0one123/Paralox3D"
Issues = "https://github.com/N0one123/Paralox3D/issues"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
paralox3d = ["_native/*"]
