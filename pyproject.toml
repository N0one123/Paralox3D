[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex3d"
version = "0.1.0"
description = "A performance-first Python 3D engine with a native C++ core."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "N0one123"}]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
